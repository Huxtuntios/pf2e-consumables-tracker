name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - name: Prepare release manifest and module ZIP
        shell: bash
        run: |
          node scripts/build-release.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/module.json
            dist/module.zip
